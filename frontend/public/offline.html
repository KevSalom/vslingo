<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ca6a43">
    <title>Sin conexión | Inglés al Grano</title>
    <style>
      :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
      body { display: grid; min-height: 100vh; margin: 0; place-items: center; background: #fafaf9; color: #292524; }
      main { width: min(calc(100% - 2rem), 34rem); border: 1px solid #e7e5e4; border-radius: 1.25rem; background: #fff; padding: 1.5rem; }
      span { color: #a64e2d; font-size: .8rem; font-weight: 750; letter-spacing: .08em; text-transform: uppercase; }
      h1 { margin: .5rem 0; font-size: clamp(1.8rem, 8vw, 2.8rem); letter-spacing: -.04em; }
      p { color: #57534e; line-height: 1.6; }
      button { min-height: 2.75rem; border: 0; border-radius: .75rem; background: #ca6a43; color: #fff; font: inherit; font-weight: 700; padding: .7rem 1rem; cursor: pointer; }
      @media (prefers-color-scheme: dark) { body { background: #1c1917; color: #f5f5f4; } main { border-color: #3e3a38; background: #292524; } p { color: #d6d3d1; } span { color: #fb923c; } }
    </style>
  </head>
  <body>
    <main>
      <span>Sin conexión</span>
      <h1>Tu práctica necesita internet.</h1>
      <p>No ponemos voz, correcciones ni pagos en una cola oculta. Conéctate y vuelve a intentarlo; tus borradores locales permanecen en este dispositivo.</p>
      <button onclick="location.reload()" type="button">Volver a intentar</button>
    </main>
  </body>
</html>
