services:
  - type: web
    name: vslingo-frontend
    env: static
    buildCommand: pnpm install --frozen-lockfile && pnpm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: PNPM_VERSION
        value: 10.32.0
      - key: SITE_URL
        value: https://inglesalgrano.com
      - key: PUBLIC_API_URL
        value: https://backend.inglesalgrano.com
      - key: PUBLIC_AUTH_MODE
        value: clerk
      - key: PUBLIC_CLERK_PUBLISHABLE_KEY
        sync: false
    routes:
      - type: rewrite
        source: /presentacion
        destination: /presentacion/index.html
      - type: rewrite
        source: /presentacion/*
        destination: /presentacion/index.html
      - type: rewrite
        source: /demo
        destination: /demo/index.html
      - type: rewrite
        source: /demo/*
        destination: /demo/index.html
    headers:
      - path: /app.webmanifest
        name: Content-Type
        value: application/manifest+json
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
